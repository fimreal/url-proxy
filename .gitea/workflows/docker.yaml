name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        if: ${{ secrets.DOCKER_PASSWORD == '' }}
        run: |
          echo "::warning title=Docker Hub Secret Missing::secrets.DOCKER_PASSWORD is not set in repository Secrets. Multi-platform image will be built for verification without pushing. To enable auto-push, please add DOCKER_PASSWORD (and optionally DOCKER_USERNAME) to Settings -> Secrets and variables -> Actions."

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'epurs' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'epurs' }}/url-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Multi-Platform Image (x86_64 & ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ secrets.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
